apply plugin: 'java'
apply plugin: 'application'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

// NetBeans will automatically add "run" and "debug" tasks relying on the
// "mainClass" property. You may however define the property prior executing
// tasks by passing a "-PmainClass=<QUALIFIED_CLASS_NAME>" argument.
//
// Note however, that you may define your own "run" and "debug" task if you
// prefer. In this case NetBeans will not add these tasks but you may rely on
// your own implementation.
if (!hasProperty('mainClass')) {
    ext.mainClass = 'Main'
}

mainClassName = mainClass

repositories {
    mavenCentral()
}

dependencies {
    compile group: 'org.postgresql', name: 'postgresql', version: '42.7.13'

    // Dice notation parser/roller. 2.0.4 is the last release built for Java 8.
    // The full ANTLR tool (~14 MB) is only needed to generate the parser, so
    // just the runtime is kept.
    compile(group: 'com.bernardomg.tabletop', name: 'dice', version: '2.0.4') {
        exclude group: 'org.antlr', module: 'antlr4'
    }
    compile group: 'org.antlr', name: 'antlr4-runtime', version: '4.7.2'
    // Silences the SLF4J "no binding" warning printed by the dice library.
    runtime group: 'org.slf4j', name: 'slf4j-nop', version: '1.7.28'

    testCompile group: 'junit', name: 'junit', version: '4.12'
}

jar {
    manifest {
        attributes 'Main-Class': mainClass
    }
}
